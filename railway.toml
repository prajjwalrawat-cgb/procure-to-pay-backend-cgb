# Railway config for the API service. The Python OCR engine is a SECOND service
# deployed from its own repository (procure-to-pay-ocr); point this service's
# OCR_API_URL at it. Leave OCR_API_URL unset to use the in-repo sandbox
# simulator instead — the API runs fine either way.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
